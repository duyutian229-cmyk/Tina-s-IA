<!DOCTYPE html>
<html>
<head>
    <title>Tina's CS IA</title>
</head>
<body>
   <h1>Welcome to Tina's CS IA</h1>
<p>This is the first web page of the cafe music system.</p>

<form id="order-form" action="/submit" method="POST">
    <label for="drink">Drink:</label>
    <select id="drink" name="drink">
        <option value="latte">Latte</option>
        <option value="americano">Americano</option>
        <option value="cold_brew">Cold Brew</option>
    </select>

    <br><br>

    <label for="nickname">Nickname:</label>
    <input type="text" id="nickname" name="nickname" required>

    <br><br>

    <button type="submit">Submit Order</button>
</form>
<button id="stop-audio" type="button">Stop Test Audio</button>
<p id="result" role="status"></p>

<script>
    const form = document.getElementById("order-form");
    const result = document.getElementById("result");
    const stopButton = document.getElementById("stop-audio");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form)
            });
            const data = await response.json();

            if (!response.ok) {
                result.textContent = data.error;
                return;
            }

            const audioMessage = data.audio_started
                ? "Test audio is playing on the server computer."
                : "The order was saved, but audio could not play. Check the server terminal.";
            result.textContent = `Order #${data.order_id}: ${data.drink} for ${data.nickname}. ${audioMessage}`;
        } catch (error) {
            result.textContent = "The order could not be submitted. Please try again.";
        }
    });

    stopButton.addEventListener("click", async () => {
        try {
            const response = await fetch("/stop-audio", {method: "POST"});
            if (!response.ok) {
                throw new Error("Could not stop audio");
            }
            result.textContent = "Test audio stopped. The website is still running.";
        } catch (error) {
            result.textContent = "Could not stop audio. Check the server terminal.";
        }
    });
</script>
</body>
</html>
